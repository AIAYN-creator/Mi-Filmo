<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="t">
  <title id="t">Mi Filmo</title>
  <!--
    Isotipo: fotograma y estrella.
    Los dos raíles rojos perforados son el borde de una película; la estrella
    dorada del centro es la valoración. Las dos ideas de la app en una marca.
  -->
  <rect width="64" height="64" rx="14" fill="#1a1210"/>
  <rect x="3" y="3" width="58" height="58" rx="12" fill="none" stroke="#4a2e28" stroke-width="2"/>

  <!-- raíl izquierdo -->
  <rect x="5" y="8" width="9" height="48" rx="2" fill="#b3312c"/>
  <rect x="7" y="12" width="5" height="6" rx="1.5" fill="#1a1210"/>
  <rect x="7" y="23" width="5" height="6" rx="1.5" fill="#1a1210"/>
  <rect x="7" y="34" width="5" height="6" rx="1.5" fill="#1a1210"/>
  <rect x="7" y="45" width="5" height="6" rx="1.5" fill="#1a1210"/>

  <!-- raíl derecho -->
  <rect x="50" y="8" width="9" height="48" rx="2" fill="#b3312c"/>
  <rect x="52" y="12" width="5" height="6" rx="1.5" fill="#1a1210"/>
  <rect x="52" y="23" width="5" height="6" rx="1.5" fill="#1a1210"/>
  <rect x="52" y="34" width="5" height="6" rx="1.5" fill="#1a1210"/>
  <rect x="52" y="45" width="5" height="6" rx="1.5" fill="#1a1210"/>

  <!-- estrella -->
  <polygon fill="#d1a355" points="32,16 36.06,26.42 47.22,27.06 38.56,34.13 41.40,44.94 32,38.90 22.60,44.94 25.44,34.13 16.78,27.06 27.94,26.42"/>
</svg>
