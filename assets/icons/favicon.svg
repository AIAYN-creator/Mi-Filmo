  <rect x="4" y="10" width="7" height="44" rx="2" fill="#b3312c"/>
  <rect x="53" y="10" width="7" height="44" rx="2" fill="#b3312c"/>
  <polygon fill="#d1a355" points="32,12 37.06,25.04 51.02,25.82 40.18,34.66 43.76,48.18 32,40.60 20.24,48.18 23.82,34.66 12.98,25.82 26.94,25.04"/>
</svg>
